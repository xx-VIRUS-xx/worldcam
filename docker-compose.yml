# Local Neo4j for the worldcam graph (see docs/graph.md).
# Usage: docker compose up -d      (reads NEO4J_PASSWORD from .env)
name: worldcam

services:
  worldcam-neo4j:
    image: neo4j:5.26-community      # 5.26 LTS: native vector indexes
    container_name: worldcam-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"        # browser / http, loopback only
      - "127.0.0.1:7687:7687"        # bolt, loopback only
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      # Small footprint for an 8 GB Mac.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_memory_transaction_total_max: 256m
      # No telemetry / phone-home.
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - worldcam-neo4j-data:/data
      - worldcam-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  worldcam-neo4j-data:
  worldcam-neo4j-logs:
