[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcam"
version = "0.1.0"
description = "Camera -> detector -> tracker -> identity -> VLM -> world state -> memory. Capture layer first."
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
perception = ["ultralytics>=8.3", "scipy>=1.11"]          # YOLO detector + tracker (AGPL-3.0)
identity = ["insightface>=0.7.3", "onnxruntime>=1.18"]  # face detect + ArcFace embeddings
graph = ["neo4j>=5.20"]
engine = ["mcp>=2"]                       # MCP server exposed to the claude -p worker
all = ["worldcam[perception,identity,graph,engine]"]

[project.scripts]
worldcam-bench = "worldcam.cli.bench:main"
worldcam-preview = "worldcam.cli.preview:main"
worldcam-dualcheck = "worldcam.cli.dualcheck:main"
worldcam-rtsp-soak = "worldcam.cli.rtsp_soak:main"
worldcam-detect = "worldcam.cli.detect:main"
worldcam-run = "worldcam.cli.run:main"
worldcam-brain = "worldcam.cli.brain_admin:main"
worldcam-users = "worldcam.cli.users_admin:main"
worldcam-scene-replay = "worldcam.cli.scene_replay:main"
worldcam-graph = "worldcam.cli.graph_admin:main"
worldcam-telegram-setup = "worldcam.cli.telegram_setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"worldcam.ambiguity" = ["prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
